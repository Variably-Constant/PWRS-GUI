# Every build of this workspace, local, on a test machine or in CI, is the
# build a release ships: the x86-64 baseline whatever CPU builds it, since
# a PWRS module compiled for extensions a CPU lacks refuses to import
# there, and on Windows the C runtime linked in statically, so the native
# library and the helper load on a machine without the Visual C++
# Redistributable, which Windows does not ship. Target tables take
# precedence over a machine's own [build] rustflags, and a RUSTFLAGS or
# CARGO_ENCODED_RUSTFLAGS variable replaces them entirely, so builds leave
# both unset. aarch64-apple-darwin keeps the toolchain's own baseline.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "target-cpu=x86-64"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64"]

[target.x86_64-unknown-freebsd]
rustflags = ["-C", "target-cpu=x86-64"]

[alias]
test-fast = "test --profile test-fast"
check-fast = "check --profile test-fast"
build-fast = "build --profile test-fast"
