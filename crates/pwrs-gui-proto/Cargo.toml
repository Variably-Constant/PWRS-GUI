[package]
name = "pwrs-gui-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The messages between PWRS-GUI's sessions and its renderers, the window tree they describe, and the SubEtha rings that carry them between processes."
publish = false

[dependencies]
serde.workspace = true
# A widget's ring items, JSON objects of the widget's properties ([`source`]).
serde_json.workspace = true
postcard.workspace = true
pulldown-cmark.workspace = true
subetha-cxc.workspace = true
getrandom.workspace = true
crossbeam-queue.workspace = true
# The system's fonts by family, and the metrics tables of the face found,
# which give the height egui lays a row of text out at ([`typeface`]).
fontdb = { version = "0.24.0", optional = true }
ttf-parser = { version = "0.25.1", optional = true }

[features]
# The system fonts the renderers draw text in ([`typeface`]), which a
# session that takes another module's renderers has no use for.
typeface = ["dep:fontconfig-parser", "dep:fontdb", "dep:ttf-parser"]

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# fontconfig's own configuration, for the families it prefers
# ([`typeface`]).
[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
fontconfig-parser = { version = "0.5.8", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Threading",
] }
