[package]
name = "pwrs-gui-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "A PWRS-GUI session for any Rust program: starts the renderer, opens windows, and waits on them, with no PowerShell involved."
keywords = ["gui", "egui", "wgpu", "subetha"]
publish = false

[features]
default = ["in-process"]
# The Windows in-process path, which links the egui and HTML renderers. A
# module that takes another module's session through the native entry
# leaves it out.
in-process = ["dep:pwrs-gui-egui", "dep:pwrs-gui-web"]

[dependencies]
pwrs-gui-proto = { path = "../pwrs-gui-proto" }
arc-swap.workspace = true
notify.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
pwrs-gui-egui = { path = "../pwrs-gui-egui", optional = true }
pwrs-gui-web = { path = "../pwrs-gui-web", optional = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# The placement test reads where a window opened; the in-process runs test
# checks whether a library is loaded.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
