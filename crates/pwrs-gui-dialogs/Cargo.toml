[package]
name = "pwrs-gui-dialogs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "PWRS-GUI's native dialogs: a message, files to open, a file to save or a folder, each stored under its request while it is open, so a stopped command or a test can close it the platform's own way."
publish = false

[dependencies]
pwrs-gui-proto = { path = "../pwrs-gui-proto" }
arc-swap.workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
rfd.workspace = true

[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSWindow", "block2"] }
objc2-core-foundation = { workspace = true, features = ["CFDate", "CFDictionary", "CFString", "CFUserNotification"] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
