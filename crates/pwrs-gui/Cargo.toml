[package]
name = "pwrs-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Windows, dialogs and grids for PowerShell, drawn by Rust renderers in a helper process the module starts, or on Windows in the module itself."
keywords = ["powershell", "gui", "egui", "wgpu"]
publish = false

[lib]
crate-type = ["cdylib"]

# The renderers' processes, shipped beside the native library.
[[bin]]
name = "pwrs-gui-egui"
path = "src/bin/pwrs-gui-egui.rs"

[[bin]]
name = "pwrs-gui-web"
path = "src/bin/pwrs-gui-web.rs"

[dependencies]
pwrs.workspace = true
pwrs-gui-proto = { path = "../pwrs-gui-proto" }
pwrs-gui-client = { path = "../pwrs-gui-client" }
pwrs-gui-egui = { path = "../pwrs-gui-egui" }
pwrs-gui-web = { path = "../pwrs-gui-web" }
arc-swap.workspace = true
serde_json.workspace = true
# Save-GuiGpuSurface writes a surface's texels as a PNG.
png.workspace = true
# The Wgpu module's element types and its conversions between PowerShell
# arrays and GPU bytes, which the GPU commands use as its cmdlets do.
wgpu-pwsh.workspace = true
# A compute pass's entry point and workgroup size, for an HTML page's
# surface, which reads no shader.
naga.workspace = true

[package.metadata.pwrs]
helpers = ["pwrs-gui-egui", "pwrs-gui-web"]
# Licenses beyond cargo-pwrs's permissive defaults. egui's bundled fonts
# (epaint_default_fonts) are under OFL-1.1 and Ubuntu-font-1.0. MPL-2.0
# covers option-ext, which wry links through dirs on Linux, the BSDs and
# Apple systems.
allowed-licenses = ["OFL-1.1", "Ubuntu-font-1.0", "MPL-2.0"]

# License texts for linked crates whose packages ship none: each file contains
# the license files of the crate's repository at the commit its package
# names, and SPDX's text of the license the crate declares where those
# files contain none; the workspace's own crates take the workspace LICENSE,
# but pwrs-gui-egui, whose folder has a copy of it beside the notice of the
# code it takes from egui_commonmark.
[package.metadata.pwrs.license-files]
"accesskit@0.25.2" = "licenses/accesskit-0.25.2.txt"
"accesskit_consumer@0.39.2" = "licenses/accesskit_consumer-0.39.2.txt"
"accesskit_winit@0.34.2" = "licenses/accesskit_winit-0.34.2.txt"
"bcdec_rs@0.2.1" = "licenses/bcdec_rs-0.2.1.txt"
"ecolor@0.37.0" = "licenses/ecolor-0.37.0.txt"
