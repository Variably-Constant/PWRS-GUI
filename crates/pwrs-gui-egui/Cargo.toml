[package]
name = "pwrs-gui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "PWRS-GUI's egui renderer: draws each window the module opens in a viewport of its own and reports what people do in it."
publish = false

[dependencies]
pwrs-gui-proto = { path = "../pwrs-gui-proto", features = ["typeface"] }
pwrs-gui-dialogs = { path = "../pwrs-gui-dialogs" }
# The fonts text is drawn in by default ([`system_fonts`]).
pwrs-gui-fonts = { path = "../pwrs-gui-fonts" }
pwrs-gui-gpu = { path = "../pwrs-gui-gpu" }
arc-swap.workspace = true
crossbeam-queue.workspace = true
eframe.workspace = true
# An Image's raster pictures through the image crate, GIF and WebP animated
# ([`install_picture_loaders`]); none of egui_extras's file or network
# loaders.
egui_extras = { workspace = true, features = ["image", "gif", "webp"] }
# The image crate's decoders for the raster formats an Image takes.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
# An Image's SVG pictures, drawn in the fonts the text is drawn in
# ([`SvgLoader`]); fontdb is the version usvg takes, so both share one
# database.
resvg = { version = "0.49.0", default-features = false, features = ["text", "raster-images"] }
# The database of the system's fonts proto reads ([`system_fonts`]), which
# SVG pictures are drawn in, and the glyphs each face has, which the fonts
# for scripts the UI font lacks are found by ([`fallback`]).
fontdb = "0.24.0"
ttf-parser = "0.25.1"
# A Markdown document's https pictures ([`web::WebLoader`]): ureq over
# rustls on aws-lc-rs, as SecureFetch takes them, verifying servers against
# the Mozilla roots webpki-root-certs includes and, on Windows, the store
# schannel reads.
ureq = { version = "3.5.0", default-features = false, features = ["rustls-no-provider"] }
rustls = "0.23.46"
webpki-root-certs = "1.0.11"
# wgpu's default features, so the OpenGL backend is built beside DirectX 12,
# Vulkan and Metal whatever egui-wgpu enables.
wgpu = "30.0.1"
# A Chart's series, axes, legend, panning and zooming ([`chart`]).
egui_plot = "0.38.0"
# A Canvas's items ([`canvas`]): lyon_tessellation fills any path under
# either fill rule and strokes it with caps, joins and miters, and
# lyon_algorithms measures a path to cut a stroke's dashes and tells
# whether a point is on an item.
lyon_tessellation = "1.0.23"
lyon_algorithms = "1.0.22"
# eframe's winit, named here for its platform settings ([`loop_settings`]):
# on Windows the event loop may run off the process's first thread, and on
# macOS the application need not take the focus as it starts; and for the
# X11 window a window opening without the focus is ([`unfocused_on_map`]).
winit = "0.30.13"
# The system's clipboard, which a test's input pastes from at Ctrl+V and
# Shift+Insert, as egui-winit does for a person's keys ([`input`]): the
# version egui-winit takes, for text alone.
arboard = { version = "3.7.0", default-features = false }

# windows-sys pins a GPU driver's hook library ([`keep_driver_hooks`]) and
# brings a new window to the front ([`raise_window`]); schannel reads the
# current user's Root store, which https pictures are verified against
# ([`web`]).
[target.'cfg(windows)'.dependencies]
schannel = "0.1.30"
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

# libX11, loaded at run time as winit loads it, for where the pointer is
# when files are dropped ([`routed`]) and the property a window opening
# without the focus has ([`unfocused_on_map`]).
[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
x11-dl = "2.21.0"

# AppKit, for where the pointer is when files are dropped ([`routed`]).
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSEvent", "NSScreen"] }

# The system's own roots beside the bundled ones, which https pictures are
# verified against ([`web`]): the files OpenSSL reads, or the Keychain's on
# macOS. On Windows schannel reads the store, where this crate's own reader
# panics on a root whose uses or validity cannot be read.
[target.'cfg(not(windows))'.dependencies]
rustls-native-certs = "0.8.5"
