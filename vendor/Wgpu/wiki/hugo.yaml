# Hugo and Hextra configuration for the Wgpu wiki.

baseURL: https://variably-constant.github.io/Wgpu/
title: Wgpu Wiki
locale: en-us
enableRobotsTXT: true
enableGitInfo: true

module:
  hugoVersion:
    extended: true
    min: 0.166.0
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - identifier: docs
      name: Docs
      pageRef: /docs
      weight: 1
    - name: Search
      weight: 2
      params:
        type: search
    - name: GitHub
      weight: 3
      url: https://github.com/Variably-Constant/Wgpu
      params:
        icon: github

params:
  description: GPU compute and offscreen rendering with WGSL, GLSL and SPIR-V shaders for Windows PowerShell 5.1 and PowerShell 7, with wgpu compiled into the module; built with PoWerRuSt.

  navbar:
    displayTitle: true
    displayLogo: false

  page:
    width: wide

  theme:
    default: system
    displayToggle: true

  footer:
    displayCopyright: true
    displayPoweredBy: true

  editURL:
    enable: true
    base: https://github.com/Variably-Constant/Wgpu/edit/main/wiki/content

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  toc:
    displayTags: true
